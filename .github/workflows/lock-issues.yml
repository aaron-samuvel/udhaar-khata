name: Lock closed issues
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-inactive-days: "30"
          issue-lock-reason: "resolved"
          pr-inactive-days: "30"
          pr-lock-reason: "resolved"
